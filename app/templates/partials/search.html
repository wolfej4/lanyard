<form class="search" action="/events" method="get" role="search"
      hx-get="/events" hx-target="#results" hx-trigger="input delay:300ms, change, submit" hx-push-url="true">
  <label class="sr" for="q">Search LAN parties</label>
  <input id="q" type="search" name="q" value="{{ q }}" placeholder="City, venue or event name" autocomplete="off">
  <label class="sr" for="region">State or region</label>
  <select id="region" name="region">
    <option value="">Anywhere</option>
    {% for r in regions %}<option value="{{ r }}" {% if r|lower == region|lower %}selected{% endif %}>{{ r }}</option>{% endfor %}
  </select>
  <button type="submit">Search</button>
</form>
